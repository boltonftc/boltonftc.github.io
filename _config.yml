title: "Prime Symmetry · FTC Team 36563"
description: "Prime Symmetry is FIRST Tech Challenge Team 36563 from Bolton, Massachusetts: rookie robot builders and makers of the free Impulse 3D FTC robotics simulator and Hive Shot Lab."
author: "Prime Symmetry · FTC Team 36563"
url: "https://boltonftc.github.io"
baseurl: ""

sim_url: "https://boltonftc.github.io/impulse3dsim/"
youtube_url: "https://www.youtube.com/@FTCTeam36563PrimeSymmetry"   # shows YouTube in the nav + footer
hsl_repo: "https://github.com/boltonftc/hive-shot-lab"

plugins:
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
permalink: /:path/
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools/
  - "*.py"

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
