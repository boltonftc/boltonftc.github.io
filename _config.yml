title: "Prime Symmetry · FTC Team 36563"
description: "Prime Symmetry is FIRST Tech Challenge Team 36563 — rookie robot builders and the team behind the Impulse 3D Simulator, a free browser-based training tool for new FTC programmers."
author: "Prime Symmetry · FTC Team 36563"
url: "https://boltonftc.github.io"
baseurl: ""

sim_url: "https://boltonftc.github.io/impulse3dsim/"
# youtube_url: "https://www.youtube.com/@your-channel"   # uncomment to show YouTube in the nav + footer

plugins:
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
permalink: /:path/
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools/
  - "*.py"

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
