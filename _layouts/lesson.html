---
layout: site
---
<div class="sheet">
  <article class="sheet-inner prose">
{{ content }}
  </article>
</div>
{% if page.prev_url or page.next_url %}
<nav class="pager wrap" aria-label="Lesson navigation">
  {% if page.prev_url %}<a class="pager-prev" href="{{ page.prev_url }}"><span>Previous</span>{{ page.prev_title }}</a>{% else %}<span></span>{% endif %}
  {% if page.next_url %}<a class="pager-next" href="{{ page.next_url }}"><span>Next</span>{{ page.next_title }}</a>{% endif %}
</nav>
{% endif %}
